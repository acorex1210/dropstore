<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <title>Derma Essenza — Flyer Tratamiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    .treatment-hero { position: relative; height: 60%; border-radius: var(--radius-xl) var(--radius-xl) 0 0; overflow: hidden; }
    .treatment-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="ig-frame">
    <!-- Pattern Overlay -->
    <div class="pattern-overlay" data-pattern="noise"></div>

    <!-- Main Layout -->
    <div class="safe-zone flex flex-col h-full">
      <!-- HERO IMAGE SECTION (60%) -->
      <div class="treatment-hero relative">
        <div class="img-frame ig-portrait absolute inset-0">
          <img
            src="../assets/placeholders/placeholder-treatment.svg"
            alt="Tratamiento Derma Essenza"
            data-editable="hero-image"
            class="transition-slow"
          >
        </div>
        <!-- Badge Top Right -->
        <div class="absolute top-4 right-4 z-10" data-editable="badge">
          <span class="badge badge-gold-filled">NUEVO</span>
        </div>
        <!-- Gradient overlay for text readability -->
        <div class="absolute inset-0 bg-gradient-to-t from-navy-900/80 via-transparent to-transparent"></div>
      </div>

      <!-- CONTENT SECTION (40%) -->
      <div class="treatment-content p-6 pt-8 pb-6 flex-1">
        <!-- Category Badge -->
        <div class="mb-4" data-editable="category">
          <span class="badge badge-gold">Tratamiento Estrella</span>
        </div>

        <!-- Headline -->
        <h1 class="headline text-3xl mb-3 tracking-tight" data-editable="headline">
          Ellansé <span class="headline-gold">Manos</span>
        </h1>

        <!-- Accent Line -->
        <div class="accent-line mb-5"></div>

        <!-- Subheadline -->
        <p class="subhead text-lg mb-6" data-editable="subhead">
          Bioestimulador de colágeno natural para rejuvenecimiento dorsal de manos
        </p>

        <!-- Benefits Grid -->
        <div class="benefits-grid mb-6">
          <div class="benefit-item" data-editable="benefit-1">
            <div class="benefit-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div class="benefit-title" data-editable="benefit-1-title">Natural</div>
            <div class="benefit-desc" data-editable="benefit-1-desc">Resultados progresivos y armónicos</div>
          </div>
          <div class="benefit-item" data-editable="benefit-2">
            <div class="benefit-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
              </svg>
            </div>
            <div class="benefit-title" data-editable="benefit-2-title">Duradero</div>
            <div class="benefit-desc" data-editable="benefit-2-desc">Hasta 2-4 años según tipo</div>
          </div>
          <div class="benefit-item" data-editable="benefit-3">
            <div class="benefit-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <div class="benefit-title" data-editable="benefit-3-title">Seguro</div>
            <div class="benefit-desc" data-editable="benefit-3-desc">Aprobado FDA y CE médico</div>
          </div>
        </div>

        <!-- Divider -->
        <hr class="divider mb-5 mx-auto">

        <!-- Key Info Grid -->
        <div class="key-info" data-editable="key-info">
          <div class="key-info-item">
            <div class="key-info-label">Duración</div>
            <div class="key-info-value gold" data-editable="duracion">30 min</div>
          </div>
          <div class="key-info-item">
            <div class="key-info-label">Sesiones</div>
            <div class="key-info-value" data-editable="sesiones">1-2</div>
          </div>
          <div class="key-info-item">
            <div class="key-info-label">Recuperación</div>
            <div class="key-info-value" data-editable="recuperacion">Inmediata</div>
          </div>
        </div>

        <!-- CTA -->
        <button class="btn-cta btn-cta-primary btn-cta-full btn-cta-lg mt-6" data-editable="cta">
          Agendar valoración gratuita
        </button>
      </div>

      <!-- Watermark -->
      <div class="watermark">Derma Essenza</div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/export.js"></script>
  <script>
    // Initialize editor for this template
    document.addEventListener('DOMContentLoaded', () => {
      DermaEditor.init('treatment-flyer');
      DermaExport.createExportButton({ templateName: 'flyer_ellanse_manos' });
    });
  </script>
</body>
</html>
