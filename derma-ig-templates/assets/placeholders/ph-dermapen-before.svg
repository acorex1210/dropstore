      <stop offset="0%" style="stop-color:#111A2E"/>
      <stop offset="100%" style="stop-color:#0B1220"/>
    </linearGradient>
    <clipPath id="dermaClip"><ellipse cx="540" cy="675" rx="380" ry="500"/></clipPath>
  </defs>
  <rect fill="url(#bgGradDB)" width="1080" height="1350"/>
  <!-- Dermapen ANTES: cicatrices acné, poros abiertos, textura irregular -->
