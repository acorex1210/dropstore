  <!-- Textos -->
  <text x="540" y="1220" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#C5A572">PLACEHOLDER - DERMAPEN ANTES</text>
  <text x="540" y="1250" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5A7294">Cicatrices acné · Poros abiertos · Textura irregular · 4:5</text>
