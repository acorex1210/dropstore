    <ellipse cx="540" cy="675" rx="380" ry="500" fill="#C8A07A"/>
    <!-- Cicatrices acné (pockmarks) -->
    <g fill="#9A7B5E" opacity="0.6">
      <circle cx="420" cy="580" r="8"/><circle cx="460" cy="560" r="6"/><circle cx="500" cy="590" r="7"/>
      <circle cx="580" cy="570" r="5"/><circle cx="620" cy="600" r="6"/><circle cx="660" cy="580" r="7"/>
      <circle cx="440" cy="650" r="6"/><circle cx="520" cy="680" r="5"/><circle cx="600" cy="660" r="7"/>
      <circle cx="640" cy="690" r="6"/><circle cx="480" cy="720" r="5"/><circle cx="560" cy="730" r="6"/>
    </g>
    <!-- Poros dilatados -->
    <g fill="#2D2D2D" opacity="0.3">
      <circle cx="380" cy="620" r="3"/><circle cx="400" cy="610" r="2"/><circle cx="420" cy="630" r="3"/>
      <circle cx="660" cy="620" r="3"/><circle cx="680" cy="610" r="2"/><circle cx="700" cy="630" r="3"/>
      <circle cx="400" cy="700" r="2"/><circle cx="420" cy="720" r="3"/><circle cx="440" cy="710" r="2"/>
      <circle cx="620" cy="700" r="2"/><circle cx="640" cy="720" r="3"/><circle cx="660" cy="710" r="2"/>
    </g>
