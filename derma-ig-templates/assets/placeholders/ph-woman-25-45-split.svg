      <clipPath id="halfFaceClipR"><rect x="540" y="0" width="540" height="1080"/></clipPath>
      <radialGradient id="faceShadeR" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="100%" stop-color="#0B1220" stop-opacity="0.15"/>
