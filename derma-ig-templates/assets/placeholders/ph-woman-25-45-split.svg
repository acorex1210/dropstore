      <stop offset="100%" style="stop-color:#F8F9FA"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bgSplit)" width="1080" height="1080"/>
  <line x1="540" y1="0" x2="540" y2="1080" stroke="#E9ECEF" stroke-width="1"/>

  <!-- LADO IZQUIERDO: Mujer 25 años - Piel joven -->
  <g clip-path="url(#halfFaceClipL)">
    <defs>
      <clipPath id="halfFaceClipL"><rect x="0" y="0" width="540" height="1080"/></clipPath>
    </defs>
    <ellipse cx="270" cy="540" rx="300" ry="400" fill="#E8D5C4"/>
    <ellipse cx="270" cy="540" rx="300" ry="400" fill="transparent" stroke="#D4C4B0" stroke-width="2" opacity="0.3"/>
    <ellipse cx="180" cy="460" rx="50" ry="28" fill="#2D2D2D"/>
    <ellipse cx="185" cy="460" rx="16" ry="16" fill="#1A1A1A"/>
    <path d="M110 410 Q180 390 250 410" stroke="#4A4A4A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="270" cy="580" rx="25" ry="35" fill="#D4C4B0" opacity="0.3"/>
    <ellipse cx="270" cy="720" rx="80" ry="28" fill="#D4A59A"/>
    <ellipse cx="270" cy="715" rx="65" ry="18" fill="#E0B8AC"/>
    <ellipse cx="270" cy="540" rx="250" ry="350" fill="#F5ECE0" opacity="0.2"/>
