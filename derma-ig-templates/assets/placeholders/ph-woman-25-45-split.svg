  <!-- Textos -->
  <text x="270" y="980" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#C5A572">PLACEHOLDER - JOVEN 25-28</text>
  <text x="270" y="1010" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5A7294">Piel lisa · Sin arrugas · 1:1</text>
  <text x="270" y="1035" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#3A4D6E">Click para subir foto</text>
  <text x="810" y="980" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#C5A572">PLACEHOLDER - MAYOR 40-50</text>
  <text x="810" y="1010" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5A7294">Arrugas · Flacidez · Patas gallo · 1:1</text>
  <text x="810" y="1035" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#3A4D6E">Click para subir foto</text>
