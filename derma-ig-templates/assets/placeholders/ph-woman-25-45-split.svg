    <path d="M-130 20 Q-80 80 -40 120" stroke="#3A4D6E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.35" transform="translate(540,0)"/>
    <path d="M40 20 Q80 80 130 120" stroke="#3A4D6E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.35" transform="translate(540,0)"/>
    <path d="M-260 200 Q-180 320 0 300 Q180 320 260 200" stroke="#3A4D6E" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.25" transform="translate(540,0)"/>
    <ellipse cx="720" cy="460" rx="55" ry="28" fill="#2D2D2D"/>
    <ellipse cx="970" cy="460" rx="55" ry="28" fill="#2D2D2D"/>
    <ellipse cx="725" cy="460" rx="16" ry="16" fill="#1A1A1A"/>
    <ellipse cx="975" cy="460" rx="16" ry="16" fill="#1A1A1A"/>
    <path d="M650 410 Q720 390 790 410" stroke="#4A4A4A" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(540,0)"/>
    <path d="M80 410 Q130 390 180 410" stroke="#4A4A4A" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(540,0)"/>
    <ellipse cx="810" cy="580" rx="25" ry="35" fill="#C4A07A"/>
    <ellipse cx="810" cy="720" rx="80" ry="28" fill="#D4A59A"/>
    <ellipse cx="810" cy="715" rx="65" ry="18" fill="#E0B8AC"/>
    <ellipse cx="810" cy="540" rx="280" ry="350" fill="#C8A07A" opacity="0.2"/>
