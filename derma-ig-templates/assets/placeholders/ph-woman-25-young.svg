<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGradY" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F8F9FA"/>
    </linearGradient>
    <clipPath id="halfFaceClip"><rect x="0" y="0" width="540" height="1080"/></clipPath>
  </defs>
  <rect fill="url(#bgGradY)" width="1080" height="1080"/>
  <!-- Piel joven - lado izquierdo (visible) -->
  <g clip-path="url(#halfFaceClip)">
    <ellipse cx="270" cy="540" rx="300" ry="400" fill="#E8D5C4"/>
    <!-- Sutil sombra contorno -->
    <ellipse cx="270" cy="540" rx="300" ry="400" fill="transparent" stroke="#D4C4B0" stroke-width="2" opacity="0.3"/>
    <!-- Ojo -->
    <ellipse cx="180" cy="460" rx="50" ry="28" fill="#2D2D2D"/>
    <ellipse cx="185" cy="460" rx="16" ry="16" fill="#1A1A1A"/>
    <!-- Ceja limpia -->
    <path d="M110 410 Q180 390 250 410" stroke="#4A4A4A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Nariz -->
    <ellipse cx="270" cy="580" rx="25" ry="35" fill="#D4C4B0" opacity="0.3"/>
    <!-- Labios -->
    <ellipse cx="270" cy="720" rx="80" ry="28" fill="#D4A59A"/>
    <ellipse cx="270" cy="715" rx="65" ry="18" fill="#E0B8AC"/>
    <!-- Piel perfecta - sin arrugas -->
  </g>
  <!-- Divisor central sutil -->
  <line x1="540" y1="0" x2="540" y2="1080" stroke="#E9ECEF" stroke-width="1"/>
  <!-- Texto placeholder -->
  <text x="270" y="980" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#C5A572">PLACEHOLDER</text>
  <text x="270" y="1010" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5A7294">Mujer 20-28 · Piel joven · 1:1</text>
  <text x="270" y="1035" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#3A4D6E">Click para subir foto</text>
  <!-- Lado derecho vacío (para mujer 45) -->
  <text x="810" y="980" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#C5A572">PLACEHOLDER</text>
  <text x="810" y="1010" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5A7294">Mujer 40-50 · Con arrugas · 1:1</text>
  <text x="810" y="1035" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#3A4D6E">Click para subir foto</text>
</svg>