<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGradAH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111A2E"/>
      <stop offset="100%" style="stop-color:#0B1220"/>
    </linearGradient>
    <clipPath id="lipsClip"><rect x="140" y="200" width="800" height="950"/></clipPath>
  </defs>
  <rect fill="url(#bgGradAH)" width="1080" height="1350"/>
  <!-- Ácido Hialurónico LABIOS: definidos, hidratados, borde vermellón -->
  <g clip-path="url(#lipsClip)" transform="translate(540, 675)">
    <!-- Labio superior (arco de cupido definido) -->
    <path d="M-140 0 Q-70 -50 0 -35 Q70 -50 140 0 Q70 30 0 50 Q-70 30 -140 0" fill="#D4A88A"/>
    <!-- Volumen hidratación -->
    <path d="M-120 10 Q-60 -25 0 -18 Q60 -25 120 10 Q60 35 0 45 Q-60 35 -120 10" fill="#E8C8A8" opacity="0.6"/>
    <!-- Labio inferior (más volumen, hidratado) -->
    <path d="M-160 55 Q0 115 160 55 Q90 85 0 100 Q-90 85 -160 55" fill="#E8B898"/>
    <!-- Borde vermellón definido -->
    <path d="M-140 0 Q-70 -50 0 -35 Q70 -50 140 0" stroke="#C89A7A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-160 55 Q0 115 160 55" stroke="#C89A7A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Brillo hidratación (puntos luz) -->
    <g fill="#F5ECD8" opacity="0.7">
      <ellipse cx="-50" cy="65" rx="40" ry="15"/>
      <ellipse cx="50" cy="65" rx="40" ry="15"/>
      <ellipse cx="-40" cy="90" rx="30" ry="10"/>
      <ellipse cx="40" cy="90" rx="30" ry="10"/>
    </g>
    <!-- Filtrum sutil -->
    <ellipse cx="0" cy="-70" rx="25" ry="35" fill="#E0C8A8" opacity="0.3"/>
  </g>
  <!-- Textos -->
  <text x="540" y="1220" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#C5A572">PLACEHOLDER - AH LABIOS</text>
  <text x="540" y="1250" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5A7294">Labios definidos · Hidratación · Borde vermellón · 4:5</text>
  <text x="540" y="1275" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#3A4D6E">Click para subir foto</text>
</svg>